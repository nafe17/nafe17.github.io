<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход и Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .oauth-buttons button { background: #333; margin-top: 8px; }
        .oauth-buttons .google { background: #db4437; }
        .oauth-buttons .apple { background: #000; }
        .toggle-link { text-align: center; margin-top: 15px; cursor: pointer; color: #007bff; font-size: 14px; }
        .hidden { display: none; }
        .user-card { text-align: center; }
        .user-card p { font-size: 16px; margin-bottom: 15px; }
        .btn-logout { background: #dc3545; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <!-- Блок авторизованного пользователя -->
    <div id="user-info" class="user-card hidden">
        <h2>Личный кабинет</h2>
        <p>Вы вошли как:<br><strong id="user-display-name"></strong> (<span id="user-email-addr"></span>)</p>
        <button id="btn-logout" class="btn-logout">Выйти</button>
    </div>

    <!-- Форма авторизации -->
    <div id="auth-forms">
        <!-- Форма регистрации -->
        <div id="register-form">
            <h2>Регистрация</h2>
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="reg-name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="reg-password" required>
            </div>
            <button id="btn-register">Зарегистрироваться</button>
            <div class="toggle-link" onclick="toggleForms()">Уже есть аккаунт? Войти</div>
        </div>

        <!-- Форма входа -->
        <div id="login-form" class="hidden">
            <h2>Вход</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" required>
            </div>
            <button id="btn-login">Войти</button>
            <div class="toggle-link" onclick="toggleForms()">Создать аккаунт</div>
        </div>

        <hr>

        <!-- Кнопки OAuth -->
        <div class="oauth-buttons">
            <button class="google" id="btn-google">Войти с помощью Google</button>
            <button class="apple" id="btn-apple">Войти с помощью Apple</button>
            <button id="btn-github">Войти с помощью GitHub</button>
        </div>
    </div>
</div>

<script type="module">
     import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        updateProfile,
        signOut,
        onAuthStateChanged,
        signInWithPopup, 
        GoogleAuthProvider, 
        GithubAuthProvider, 
        OAuthProvider 
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5YErkqtwMgO2Pqi3j_-7TCHlWkecayDM",
        authDomain: "nafe17.firebaseapp.com",
        projectId: "nafe17",
        storageBucket: "nafe17.firebasestorage.app",
        messagingSenderId: "1047284797132",
        appId: "1:1047284797132:web:5d5b1755420e542ee33c69"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Слушатель состояния авторизации
    onAuthStateChanged(auth, (user) => {
        const userInfoDiv = document.getElementById('user-info');
        const authFormsDiv = document.getElementById('auth-forms');

        if (user) {
            // Пользователь вошел
            document.getElementById('user-display-name').textContent = user.displayName || "Пользователь";
            document.getElementById('user-email-addr').textContent = user.email;
            
            userInfoDiv.classList.remove('hidden');
            authFormsDiv.classList.add('hidden');
        } else {
            // Пользователь вышел
            userInfoDiv.classList.add('hidden');
            authFormsDiv.classList.remove('hidden');
        }
    });

    // Выход из аккаунта
    document.getElementById('btn-logout').addEventListener('click', async () => {
        try {
            await signOut(auth);
            alert("Вы вышли из аккаунта!");
        } catch (e) { alert("Ошибка при выходе: " + e.message); }
    });

    // Регистрация
    document.getElementById('btn-register').addEventListener('click', async () => {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(userCredential.user, { displayName: name });
        } catch (e) { alert("Ошибка регистрации: " + e.message); }
    });

    // Вход
    document.getElementById('btn-login').addEventListener('click', async () => {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (e) { alert("Ошибка входа: " + e.message); }
    });

    // Вход через социальные сети
    const handlePopupSignIn = async (provider) => {
        try { await signInWithPopup(auth, provider); } catch (e) { alert("Ошибка: " + e.message); }
    };

    document.getElementById('btn-google').addEventListener('click', () => handlePopupSignIn(new GoogleAuthProvider()));
    document.getElementById('btn-github').addEventListener('click', () => handlePopupSignIn(new GithubAuthProvider()));
    document.getElementById('btn-apple').addEventListener('click', () => handlePopupSignIn(new OAuthProvider('apple.com')));

    window.toggleForms = () => {
        document.getElementById('register-form').classList.toggle('hidden');
        document.getElementById('login-form').classList.toggle('hidden');
    };
</script>
</body>
</html>
